[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "imandrax-dgm-unified"
version = "1.1.0"
description = "Unified ImandraX mathematical knowledge, DGM research evolution and owner-approved RSI"
requires-python = ">=3.11"
dependencies = ["cryptography>=41"]
[project.optional-dependencies]
test = ["pytest>=8"]
[project.scripts]
imandrax-dgm = "imandrax_dgm.cli:main"
imandrax-rsi = "imandrax_dgm.rsi_cli:main"
imandrax-cycle = "imandrax_dgm.cycle_cli:main"
imandrax-authority = "imandrax_dgm.authority_cli:main"
imandrax-daemon = "imandrax_dgm.daemon:main"
imandrax-apex = "imandrax_dgm.apex_cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
