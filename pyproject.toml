[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "imandrax-dgm-unified"
version = "0.2.0"
description = "Research-only ImandraX+DGM with human-approved RSI"
requires-python = ">=3.11"
dependencies = ["cryptography>=41"]
[project.optional-dependencies]
test = ["pytest>=8"]
[project.scripts]
imandrax-dgm = "imandrax_dgm.cli:main"
imandrax-rsi = "imandrax_dgm.rsi_cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]