name: imandrax-dgm-unified-research
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: imandrax-dgm-research
  cancel-in-progress: false
jobs:
  public-research-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Collect bounded public research metadata (no secrets, no mutations)
        run: python scripts/research_watch.py --output "${RUNNER_TEMP}/research-watch.json"
      - name: Preserve research report for human review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-watch-${{ github.run_id }}
          path: ${{ runner.temp }}/research-watch.json
          if-no-files-found: ignore
          retention-days: 30
  bounded-rsi-proposer:
    # Human-enabled only after supplying credentials and configuring independent authority.
    if: ${{ vars.RSI_CYCLE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RSI_LLM_ENDPOINT: ${{ vars.RSI_LLM_ENDPOINT }}
      RSI_LLM_MODEL: ${{ vars.RSI_LLM_MODEL }}
      RSI_LLM_ALLOWED_HOSTS: ${{ vars.RSI_LLM_ALLOWED_HOSTS }}
      RSI_LLM_API_KEY: ${{ secrets.RSI_LLM_API_KEY }}
      RSI_SANDBOX_IMAGE: python:3.12-slim
      RSI_CI_ALLOW_UNPINNED_IMAGE: 'true' # research only; production requires immutable digest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Require explicit owner-supplied model configuration
        run: |
          test -n "$RSI_LLM_API_KEY"
          test -n "$RSI_LLM_ENDPOINT"
          test -n "$RSI_LLM_MODEL"
          test -n "$RSI_LLM_ALLOWED_HOSTS"
      - name: Build minimal class-level source index (not full 19k index)
        run: python scripts/build_msc_class_index.py --output "${RUNNER_TEMP}/msc-class.sqlite3"
      - name: Prepare isolated evaluator
        run: docker pull python:3.12-slim
      - name: Mathematical research -> DGM candidate -> RSI review registration
        run: |
          python -m imandrax_dgm.cli --root . evolve \
            --knowledge-db "${RUNNER_TEMP}/msc-class.sqlite3" \
            --state-dir "${RUNNER_TEMP}/rsi-state" \
            --campaign-id "cycle-${GITHUB_RUN_ID}" \
            --source MSC2020-CLASS-ROUTING --code 00-XX \
            --base-commit "${GITHUB_SHA}" \
            --output "${RUNNER_TEMP}/rsi-review" --max-candidates 2
      - name: Store review artifacts; never commit, approve, merge or deploy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: human-review-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/rsi-review/
            ${{ runner.temp }}/rsi-state/
          if-no-files-found: ignore
          retention-days: 30