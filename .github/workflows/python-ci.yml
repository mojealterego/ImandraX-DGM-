name: imandrax-dgm-rsi-ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-and-negative:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Unit and adversarial controls
        run: python -m pytest -q
      - name: Local architecture boundary gate
        run: python scripts/check_architecture.py
      - name: Syntax
        run: python -m compileall -q src scripts
      - name: Complete offline engine simulation
        run: imandrax-dgm --root . simulate --output "$RUNNER_TEMP/imandrax-reference"
      - uses: actions/upload-artifact@v4
        with:
          name: simulation-reference-evidence
          path: ${{ runner.temp }}/imandrax-reference
      - name: Formalization source coverage (not proof acceptance)
        run: python scripts/proof_coverage_report.py
      - name: Public inventory
        run: python -m imandrax_dgm.cli inventory
      - name: Assert no self-approval or code deployment API
        run: |
          python - <<'PY'
          from imandrax_dgm.rsi import RSIReviewStore, RSIInbox
          from imandrax_dgm.cycle import ResearchCycle
          assert not hasattr(RSIReviewStore,'apply_patch')
          assert not hasattr(RSIReviewStore,'deploy')
          assert not hasattr(RSIInbox,'apply_patch')
          assert not hasattr(ResearchCycle,'merge')
          PY
  isolated-docker-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Docker runtime available
        run: docker info
      - name: Pull evaluation image (CI only; prod requires digest pin)
        run: docker pull python:3.12-slim
      - name: Real networkless unprivileged candidate execution
        run: python scripts/smoke_docker.py
      - name: Complete engine simulation with actual isolated candidates
        run: |
          SIM_IMAGE=$(docker image inspect python:3.12-slim --format '{{index .RepoDigests 0}}')
          imandrax-dgm --root . simulate --backend docker --image "$SIM_IMAGE" --output "$RUNNER_TEMP/imandrax-docker"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulation-docker-evidence
          path: ${{ runner.temp }}/imandrax-docker
  mujoco-physics-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual MuJoCo physics runtime
        run: python -m pip install 'mujoco==3.3.6'
      - name: Deterministic CPU pendulum simulation
        run: python scripts/mujoco_smoke.py
  lean-proof-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Reject proof holes and locally declared axioms
        run: |
          if grep -R -nE '(^|[^[:alnum:]_])(sorry|admit|axiom|unsafe)([^[:alnum:]_]|$)' proofs/ImandraX --include='*.lean'; then
            echo 'Unverified proof hole or local axiom detected'; exit 1
          fi
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs
          build: true
          test: false
          lint: false
          use-github-cache: true

  apex-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Verified cross-engine APEX integration and owner-gated upgrades
        run: python -m pytest -q tests/test_apex_v07.py tests/test_apex_real_integration_v07.py
      - name: Real persistent CLI and source-backed exact computation
        run: |
          python -m imandrax_dgm.apex_cli --root "$GITHUB_WORKSPACE" --state-dir "$RUNNER_TEMP/omega-apex" status
          python -m imandrax_dgm.apex_cli --root "$GITHUB_WORKSPACE" --state-dir "$RUNNER_TEMP/omega-apex" start
          python -m imandrax_dgm.apex_cli --root "$GITHUB_WORKSPACE" --state-dir "$RUNNER_TEMP/omega-apex" math --operation gcd --arguments '{"a":84,"b":18}'
          python -m imandrax_dgm.apex_cli --root "$GITHUB_WORKSPACE" --state-dir "$RUNNER_TEMP/omega-apex" verify
          python -m imandrax_dgm.apex_cli --root "$GITHUB_WORKSPACE" --state-dir "$RUNNER_TEMP/omega-apex" pause

  wheel-and-artifact-integrity:
    # Owner decision: distribution builds paused until engine expansion is complete.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated wheel and sdist build tools
        run: python -m pip install 'build>=1.2,<3'
      - name: Build both package distributions
        run: python -m build --wheel --sdist --outdir dist .
      - name: Verify package metadata and produce unsigned artifact checksums
        run: |
          python scripts/release_artifact_report.py --dist dist --project pyproject.toml --commit "$GITHUB_SHA" --output build_evidence.json
          python -c 'import json; d=json.load(open("build_evidence.json")); assert d["release_authorized"] is False; assert len(d["artifacts"]) == 2'
      - name: Install wheel into clean interpreter and smoke the real CLI
        run: |
          python -m venv "$RUNNER_TEMP/omega-wheel"
          "$RUNNER_TEMP/omega-wheel/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/omega-wheel/bin/imandrax-dgm" --root "$GITHUB_WORKSPACE" inventory > "$RUNNER_TEMP/omega-inventory.json"
          python -c 'import json,sys; assert json.load(open(sys.argv[1]))["total"] == 701' "$RUNNER_TEMP/omega-inventory.json"
          "$RUNNER_TEMP/omega-wheel/bin/imandrax-dgm" --root "$GITHUB_WORKSPACE" simulate --output "$RUNNER_TEMP/imandrax-wheel-simulation"
      - name: Preserve unsigned build evidence for manual review
        uses: actions/upload-artifact@v4
        with:
          name: omega-v1.1-unsigned-package-evidence
          path: |
            dist/*.whl
            dist/*.tar.gz
            build_evidence.json
          retention-days: 14

  independent-trust-negative-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Validate independent gate contracts and OpenShift staging policy
        run: python -m pytest -q tests/test_release_admission_v12.py tests/test_staging_security_v12.py
      - name: Assert unconfigured production authority fails closed
        run: |
          python - <<'PY'
          import json
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from cryptography.hazmat.primitives import serialization
          from imandrax_dgm.release_admission import REQUIRED_ROLES, evaluate_release
          keys = {}
          for role in REQUIRED_ROLES:
              sk = Ed25519PrivateKey.generate()
              keys[role] = sk.public_key().public_bytes(
                  serialization.Encoding.Raw,serialization.PublicFormat.Raw)
          result = evaluate_release(source_sha="a"*40,artifact_sha256="b"*64,
                                    trusted_keys=keys,receipts={},now=1800000000)
          assert result["release_authorized"] is False
          assert result["status"] == "BLOCKED_MISSING_INDEPENDENT_EVIDENCE"
          result["note"] = "NEGATIVE TEST ONLY, ephemeral fixture public keys"
          with open("negative_gate_evidence.json","w",encoding="utf-8") as f:
              json.dump(result,f,sort_keys=True,indent=2)
          PY
      - name: Record blocked status, not a production approval
        uses: actions/upload-artifact@v4
        with:
          name: omega-trust-gate-negative-test-only
          path: negative_gate_evidence.json
          retention-days: 14
