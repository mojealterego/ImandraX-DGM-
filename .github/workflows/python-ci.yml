name: imandrax-dgm-rsi-ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-and-negative:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - name: Unit and adversarial controls
        run: python -m pytest -q
      - name: Syntax
        run: python -m compileall -q src scripts
      - name: Public inventory
        run: python -m imandrax_dgm.cli inventory
      - name: Assert no self-approval or code deployment API
        run: |
          python - <<'PY'
          from imandrax_dgm.rsi import RSIReviewStore, RSIInbox
          from imandrax_dgm.cycle import ResearchCycle
          assert not hasattr(RSIReviewStore,'apply_patch')
          assert not hasattr(RSIReviewStore,'deploy')
          assert not hasattr(RSIInbox,'apply_patch')
          assert not hasattr(ResearchCycle,'merge')
          PY
  isolated-docker-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Docker runtime available
        run: docker info
      - name: Pull evaluation image (CI only; prod requires digest pin)
        run: docker pull python:3.12-slim
      - name: Real networkless unprivileged candidate execution
        run: python scripts/smoke_docker.py
  mujoco-physics-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual MuJoCo physics runtime
        run: python -m pip install 'mujoco==3.3.6'
      - name: Deterministic CPU pendulum simulation
        run: python scripts/mujoco_smoke.py
  lean-proof-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Reject proof holes and locally declared axioms
        run: |
          if grep -R -nE '(^|[^[:alnum:]_])(sorry|admit|axiom|unsafe)([^[:alnum:]_]|$)' proofs/ImandraX --include='*.lean'; then
            echo 'Unverified proof hole or local axiom detected'; exit 1
          fi
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs
          build: true
          test: false
          lint: false
          use-github-cache: true
