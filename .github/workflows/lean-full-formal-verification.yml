name: lean-full-formal-verification
on:
  push:
    branches: [main]
    paths:
      - 'proofs/**'
      - 'proofs_mathlib/**'
      - 'src/imandrax_dgm/formal_verification.py'
      - '.github/workflows/lean-full-formal-verification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # The proof checking job does not trust a generated theorem or its build result.
  imandrax-core-external-kernels:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs
          build: true
          test: false
          lint: false
          use-github-cache: true
      - name: Independent kernel replay of ImandraX source proofs
        working-directory: proofs
        run: |
          lake env leanchecker --fresh ImandraX
          lake env leanexport ImandraX > "$RUNNER_TEMP/imandrax-core.ndjson"
          # Export is built only from owner-approved main, not untrusted RSI patches.
      - name: Independent checkers inside no-network, read-only Docker sandbox
        working-directory: proofs
        run: |
          set -euo pipefail
          toolchain_dir="$(dirname "$(dirname "$(elan which lean)")")"
          test -x "$toolchain_dir/bin/lake"
          chmod 644 "$RUNNER_TEMP/imandrax-core.ndjson"
          printf 'FROM ubuntu:24.04\nRUN apt-get update && apt-get install -y --no-install-recommends git ca-certificates && rm -rf /var/lib/apt/lists/*\n' | docker build -t imandrax-lean-checker:v0.6 -
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 64 --memory 5g --cpus 2 \
            --user 10001:10001 --tmpfs /tmp:rw,nosuid,nodev,size=128m \
            -v "$toolchain_dir:/opt/lean:ro" \
            -v "$RUNNER_TEMP/imandrax-core.ndjson:/export.ndjson:ro" \
            -e LEAN_SYSROOT=/opt/lean -e PATH=/opt/lean/bin:/usr/bin:/bin \
            imandrax-lean-checker:v0.6 /opt/lean/bin/lake check --paranoid \
            --from-export=/export.ndjson --inadvisably-no-sandbox
  # This target is the entire Mathlib umbrella, not a single Basic module.
  mathlib-full-build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: mojealterego/mathlib4
          ref: d0207795ac79006da92d98544e1ce915ae386160
          path: upstream
          persist-credentials: false
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: upstream
          build: false
          test: false
          lint: false
          use-github-cache: true
      - name: Fetch content-addressed upstream Mathlib cache
        working-directory: upstream
        run: lake exe cache get
      - name: Compile full Mathlib umbrella target
        working-directory: upstream
        run: lake build Mathlib
      - name: Replay bounded module with Lean kernel (full library replay requires high-memory runner)
        working-directory: upstream
        run: lake env leanchecker Mathlib.Algebra.Group.Basic
  # Own formal proofs are linked to the full mathlib dependency at a pinned SHA.
  imandrax-mathlib-proofs:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: proofs
          build: false
          test: false
          lint: false
          use-github-cache: true
      - name: Resolve pinned Mathlib dependency
        working-directory: proofs_mathlib
        run: lake update
      - name: Download verified-by-hash build artifacts (not proof acceptance)
        working-directory: proofs_mathlib
        run: lake exe cache get
      - name: Compile ImandraXMathlib formal theorems
        working-directory: proofs_mathlib
        run: lake build ImandraXMathlib
      - name: Kernel replay of own proofs
        working-directory: proofs_mathlib
        run: lake env leanchecker ImandraXMathlib.Foundations
      - name: Independent external kernel verification scope
        run: echo "Full Mathlib external kernel replay requires a high-memory isolated runner; NOT VERIFIED here"
